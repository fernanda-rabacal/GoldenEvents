name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # backend's lint script runs eslint --fix, so fail if it rewrote anything
      - name: Lint
        run: |
          bun run lint
          git diff --exit-code

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: E2E tests
        run: bunx turbo run test:e2e --filter=golden-events-api

  browser-e2e:
    name: browser-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Browser E2E tests
        run: bunx turbo run test:e2e --filter=@golden-events/e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.logs
          include-hidden-files: true
          retention-days: 7
