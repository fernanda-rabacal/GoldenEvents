services:
  db:
    image: postgres:16-alpine
    container_name: golden-events-db
    environment:
      POSTGRES_DB: 'golden_events'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golden_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:16-alpine
    container_name: integration-test-db
    restart: always
    environment:
      POSTGRES_DB: 'golden_events'
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'password'
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d golden_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Backend do BullMQ (fluxo de pagamentos). noeviction evita que o Redis descarte jobs ao encher a memória.
  redis:
    image: redis:7-alpine
    container_name: golden-events-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    container_name: golden-events-api
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: 'postgresql://postgres:password@db:5432/golden_events?schema=public'
      REDIS_URL: 'redis://redis:6379'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "5555:5555"

  web:
    container_name: golden-events-web
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: 'http://api:8080'
    depends_on:
      - api
      - db
    ports:
      - "3000:3000"

volumes:
  pg-data:
  redis-data:
