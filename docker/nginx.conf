server {
  listen 80;
  server_tokens off;

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    # $http_host mantém a porta: as Server Actions recusam a requisição se o Origin não bater com o Host
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Sobrescreve em vez de acrescentar: um X-Forwarded-For inventado pelo navegador é descartado
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
